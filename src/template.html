<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <nav>
            
        </nav>
        <div class="dropdown">
            <button type="button" class="dropbtn">
                <img src="./icons/plus.svg" alt="not">
                <img src="./icons/chevron-down.svg" alt="">
            </button>
            <div id="myDropdown" class="dropdown-content">
                <button type="button" class="new-task-btn">Create New Task</button>
                <button type="button" class="new-project-btn">Create New Project</button>
            </div>
        </div>
    </header>

    <div class="display-tasks-container">
    </div>

 

    <dialog id="task-form">
        <h1 id="task-form-title">New Task</h1>
        <form class="task-form-container">
            <label for="title">Title:* </label>
            <input type="text" id="title" placeholder="Enter Title of Your ToDo item" name="title" required />
    
            <label for="description">Description:* </label>
            <input type="text" id="description" placeholder="Enter Description of Your ToDo Item" name="description"
                required />
    
            <label for="dueDate">Due Date:* </label>
            <input type="date" id="dueDate" name="dueDate" required />
    
            <label for="priority">Priority:*</label>
            <select id="priority" name="priority" required>
                <option value="" disabled selected>Please select a priority level...</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
    
            <label for="project-list">Project:</label>
            <select id="project-list" name="project-list">
                <!-- <option value="default" selected>Default</option> -->
            </select>
            <input id="prevId" type="hidden" name="prevId"/>
            <button id="task-form-btn" type="submit"></button>
    
        </form>
        <button id="close-task-form">Close</button>
    </dialog>

    <dialog id="project-form">
        <form class="project-form-container">
                <label for="project">Project Name:</label>
                <input type="text" id="project" name="project" required />
                <button type="submit">Submit</button>
        </form>
        <button id="close-project-form">Close</button>
    </dialog>

    <dialog id="task-card">
    </dialog>
</body>
</html>
