<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <nav>
            
        </nav>
        <div class="dropdown">
            <button type="button" class="dropbtn">
                <img src="./icons/plus.svg" alt="not">
                <img src="./icons/chevron-down.svg" alt="">
            </button>
            <div id="myDropdown" class="dropdown-content">
                <button type="button" class="new-task-btn">Create New Task</button>
                <button type="button" class="new-project-btn">Create New Project</button>
            </div>
        </div>
    </header>
    <!-- <table id="myTable"> 
        <thead>
            <tr id="header">
                <th>Title</th>
                <th>Description</th>
                <th>Due Date</th>
                <th>Priority</th>
            </tr>
        </thead>
    </table>  -->

    <div class="display-tasks-container">
    </div>

 

    <dialog id="new-task-popup">
        <h1>Add New Task</h1>
        <form class="new-task-form-container">
            <label for="title">Title:* </label>
            <input type="text" id="title" placeholder="Enter Title of Your ToDo item" name="title" required />
    
            <label for="description">Description:* </label>
            <input type="text" id="description" placeholder="Enter Description of Your ToDo Item" name="description"
                required />
    
            <label for="date">Due Date:* </label>
            <input type="date" id="date" name="date" required />
    
            <label for="priority">Priority:*</label>
            <select id="priority" name="priority" required>
                <option value="" disabled selected>Please select a priority level...</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
    
            <label for="project-list">Project:</label>
            <select id="project-list" name="project-list">
                <!-- <option value="default" selected>Default</option> -->
            </select>
            <button type="submit">Submit</button>
    
        </form>
        <button id="close-new-task-popup">Close</button>
    </dialog>

    <dialog id="new-project-popup">
        <form class="new-project-form-container">
                <label for="new-project">Project Name:</label>
                <input type="text" id="new-project" name="new-project" required />
                <button type="submit">Submit</button>
        </form>
        <button id="close-new-project-popup">Close</button>
    </dialog>

    <dialog id="card-popup">

    </dialog>
</body>
</html>
