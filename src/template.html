<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="form-popup">
        <form class="form-container">
            <h1>Add a new item to your ToDo List</h1>
            <fieldset>
                <label for="title">Title:* </label>
                <input type="text" id="title" placeholder="Enter Title of Your ToDo item" name="title" required />
                
                <label for="description">Description:* </label>
                <input type="text" id="description" placeholder="Enter Description of Your ToDo Item" name="description" required />
                
                <label for="date">Due Date:* </label>
                <input type="date" id="date" name="date" required />

                <label for="priority">Priority:*</label>
                <select id="priority" name="priority" required>
                    <option value="" disabled selected>Please select a priority level...</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button type="submit" class="btn">Submit</button>
                
            </fieldset>
        </form>
    </div>
</body>
</html>
